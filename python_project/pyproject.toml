[project]
name = "digital-aquarium"
version = "0.1.0"
description = "Evolution of agents in a virtual environment using neural networks and a genetic algorithm"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "pygame==2.6.1",
    "pygame-gui==0.6.13",
    "torch==2.6.0+cpu",    # Сейчас GPU нет.
    # "torch==2.6.0+cu126", # Если появится NVIDIA GPU.
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# [[tool.uv.index]]
# name = "pytorch-cu126"
# url = "https://download.pytorch.org/whl/cu126"
# explicit = true
